info:
  name: Upload a single file with other data (e.g. name, price)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/uploads/single"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: <string>
      - name: price
        type: text
        value: <number>
      - name: folder
        type: text
        value: products
      - name: file
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
