info:
  name: Upload multiple files (same field name) with other data
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/uploads/multiple"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: <string>
      - name: price
        type: text
        value: <number>
      - name: folder
        type: text
        value: products
      - name: files
        type: text
        value: <binary>,<binary>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
