info:
  name: Upload mixed files (e.g. image and document) with other data
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/uploads/mixed"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: <string>
      - name: price
        type: text
        value: <number>
      - name: image
        type: file
        value: []
      - name: document
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
