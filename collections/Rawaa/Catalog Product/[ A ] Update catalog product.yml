info:
  name: "[ A ] Update catalog product"
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/catalog-product/:id"
  headers:
    - name: Content-Type
      value: multipart/form-data
  params:
    - name: id
      value: <string>
      type: path
      description: "(Required) "
  body:
    type: multipart-form
    data:
      - name: brandId
        type: text
        value: <string>
      - name: packageSizeId
        type: text
        value: <string>
      - name: name
        type: text
        value: <string>
      - name: description
        type: text
        value: <string>
      - name: image
        type: file
        value: []
      - name: volume
        type: text
        value: "600"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
