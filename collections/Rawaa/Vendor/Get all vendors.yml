info:
  name: Get all vendors
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/vendors"
  params:
    - name: search
      value: <string>
      type: query
      disabled: true
    - name: page
      value: <string>
      type: query
      disabled: true
    - name: limit
      value: <string>
      type: query
      disabled: true
    - name: sortBy
      value: address
      type: query
      description: " (This can only be one of storeName,address,createdAt,updatedAt)"
      disabled: true
    - name: sortOrder
      value: DESC
      type: query
      description: " (This can only be one of ASC,DESC)"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
