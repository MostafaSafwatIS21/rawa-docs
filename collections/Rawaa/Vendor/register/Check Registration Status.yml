info:
  name: Check Registration Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/vendors/register/status"
  headers:
    - name: Authorization
      value: Bearer YOUR_REGISTRATION_TOKEN_HERE
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
