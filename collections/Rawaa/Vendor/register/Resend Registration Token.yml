info:
  name: Resend Registration Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/vendors/register/resend-token"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "identifier": "vendor@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
