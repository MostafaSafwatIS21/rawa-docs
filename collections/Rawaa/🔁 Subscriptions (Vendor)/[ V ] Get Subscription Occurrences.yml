info:
  name: "[ V ] Get Subscription Occurrences"
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/vendor/subscriptions/{{subscriptionId}}/occurrences?page=1&limit=10"
  params:
    - name: status
      value: order_created
      type: query
      disabled: true
    - name: from
      value: 2026-08-01
      type: query
      disabled: true
    - name: to
      value: 2026-08-31
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{vendorToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Vendor only

  Returns the full occurrence history for a specific subscription (past and upcoming generated delivery records).

  **Query params:**
  - `status` *(optional)* — `scheduled` | `awaiting_payment` | `order_created` | `payment_failed` | `skipped`
  - `from` / `to` *(optional)* — date range filter (YYYY-MM-DD)
  - `page` / `limit` — pagination
