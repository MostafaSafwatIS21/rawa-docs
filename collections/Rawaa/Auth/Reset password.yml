info:
  name: Reset password
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{resetToken}}",
        "password": "Pass12345",
        "confirmPassword": "Pass12345"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
