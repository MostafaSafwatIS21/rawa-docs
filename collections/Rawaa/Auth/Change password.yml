info:
  name: Change password
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{base_url}}/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "currentPassword": "Rawaa@12345",
        "newPassword": "Pass12345"
      }
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
