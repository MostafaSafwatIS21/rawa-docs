info:
  name: Get order by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/orders/{{orderId}}"
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Customer / Vendor / Admin

  Uses the `orderId` env variable auto-saved by the Create Order request.
