info:
  name: "[ C ] Get my orders"
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/orders?page=1&limit=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: status
      value: pending
      type: query
      disabled: true
    - name: ""
      value: ec51ca1f-b685-40c1-8dc5-7ffd08443d66
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Customer — returns only own orders.

  Optional `status`: `pending`, `accepted`, `preparing`, `out_for_delivery`, `delivered`, `cancelled`.
