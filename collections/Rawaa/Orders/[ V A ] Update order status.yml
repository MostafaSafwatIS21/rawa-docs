info:
  name: "[ V A ] Update order status"
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{base_url}}/orders/{{orderId}}/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "accepted"
      }
  auth:
    type: bearer
    token: "{{vendorToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Vendor / Admin

  **Flow:** `pending` → `accepted` → `preparing` → `out_for_delivery` → `delivered`

  **Valid values:** `accepted`, `preparing`, `out_for_delivery`, `delivered`, `cancelled`
