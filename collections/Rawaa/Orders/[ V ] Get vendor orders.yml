info:
  name: "[ V ] Get vendor orders"
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/orders?page=1&limit=20"
  params:
    - name: status
      value: pending
      type: query
      disabled: true
    - name: from
      value: 2026-01-01
      type: query
      disabled: true
    - name: to
      value: 2026-12-31
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{vendorToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Vendor only — returns orders for the vendor from their JWT.

  Optional filters: `status`, `from` (ISO date), `to` (ISO date), `page`, `limit`.
