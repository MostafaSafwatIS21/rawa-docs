info:
  name: "[Admin] List Payments"
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/admin/payments"
  params:
    - name: vendorId
      value: ""
      type: query
      disabled: true
    - name: from
      value: ""
      type: query
      description: ISO date e.g. 2026-01-01
      disabled: true
    - name: to
      value: ""
      type: query
      description: ISO date e.g. 2026-12-31
      disabled: true
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (Array.isArray(res) && res.length > 0) {
          bru.setVar('paymentId', res[0].id);
          console.log('✅ paymentId saved:', res[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Admin

  Lists all payments. Optional query filters: `status`, `vendorId`, `from`, `to` (ISO date strings).
