info:
  name: "[Customer] Initiate Payment"
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/payments/initiate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "orderId": "{{orderId}}"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        if (res.tapChargeId) bru.setVar('tapChargeId', res.tapChargeId);
        if (data.paymentUrl) console.log('✅ Payment URL:', data.paymentUrl);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Customer

  Initiates a Tap charge for an unpaid order. Returns `paymentUrl` — redirect the customer to this URL to complete payment.

  **Pre-conditions:**
  - Order must be `unpaid` and `pending`
  - Vendor must have `tapStatus = ACTIVE`
