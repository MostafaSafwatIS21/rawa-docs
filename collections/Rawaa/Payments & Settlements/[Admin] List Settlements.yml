info:
  name: "[Admin] List Settlements"
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/admin/settlements"
  headers:
    - name: Authorization
      value: Bearer {{admin_token}}
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
