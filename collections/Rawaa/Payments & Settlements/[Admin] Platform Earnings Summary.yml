info:
  name: "[Admin] Platform Earnings Summary"
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/admin/earnings/summary"
  headers:
    - name: Authorization
      value: Bearer {{admin_token}}
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
