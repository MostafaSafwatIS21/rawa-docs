info:
  name: "[Admin] Get Settlement Detail"
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/admin/settlements/{{settlementId}}"
  headers:
    - name: Authorization
      value: Bearer {{admin_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
