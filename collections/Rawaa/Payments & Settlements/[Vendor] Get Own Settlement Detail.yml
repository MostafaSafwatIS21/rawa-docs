info:
  name: "[Vendor] Get Own Settlement Detail"
  type: http
  seq: 14

http:
  method: GET
  url: "{{base_url}}/vendor/settlements/{{settlementId}}"
  headers:
    - name: Authorization
      value: Bearer {{vendor_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
