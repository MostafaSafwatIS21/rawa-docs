info:
  name: Get Own Notifications
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/notifications?page=1&limit=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: isRead
      value: "false"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Get a paginated list of the current user's notifications. Optional `isRead` filter.
