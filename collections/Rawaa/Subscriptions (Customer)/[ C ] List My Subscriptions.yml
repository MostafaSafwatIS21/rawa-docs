info:
  name: "[ C ] List My Subscriptions"
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/subscriptions?page=1&limit=10"
  params:
    - name: status
      value: active
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Customer only

  Returns the authenticated customer's own subscriptions (paginated).

  **Query params:**
  - `status` *(optional)* — filter by `active` | `paused` | `cancelled`
  - `page` / `limit` — pagination
