info:
  name: "[ C ] Get Subscription Detail"
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/subscriptions/{{subscriptionId}}?occPage=1&occLimit=10"
  params:
    - name: occPage
      value: "1"
      type: query
    - name: occLimit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Customer only

  Returns subscription detail including paginated `occurrences` (delivery history).

  **Query params:**
  - `occPage` / `occLimit` — pagination for the occurrences list

  **Occurrence statuses:**
  - `scheduled` — not yet due
  - `awaiting_payment` — order created, customer must pay manually
  - `order_created` — paid and order generated
  - `payment_failed` — auto-pay charge failed
  - `skipped` — customer skipped this delivery
