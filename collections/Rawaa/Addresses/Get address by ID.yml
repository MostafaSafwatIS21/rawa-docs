info:
  name: Get address by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/addresses/{{addressId}}"
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Customer / Admin

  Gets details of a single address using the saved `addressId`.
