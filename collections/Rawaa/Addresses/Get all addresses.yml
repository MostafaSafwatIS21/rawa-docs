info:
  name: Get all addresses
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/addresses"
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Customer / Admin

  Returns all delivery addresses for the logged-in user.
