opencollection: 1.0.0

info:
  name: Rawaa
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: base_url
      value: http://localhost:3000
    - name: bearerToken
      value: ""
    - name: adminToken
      value: ""
    - name: vendorToken
      value: ""
    - name: customerToken
      value: ""
    - name: refreshToken
      value: ""
    - name: orderId
      value: ""
    - name: addressId
      value: ""
    - name: paymentId
      value: ""
    - name: tapChargeId
      value: ""
    - name: vendorId
      value: ""
    - name: subscriptionId
      value: 1247fa07-722f-4fb5-b6ed-8e4f9e71e40c
    - name: vendorProductId
      value: 81c712f6-cbfb-410c-beaa-e2d6a61971ed
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
