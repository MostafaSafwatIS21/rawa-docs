info:
  name: Admin - Get Pending Vendors
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/admin/vendors/pending?page=1&limit=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
