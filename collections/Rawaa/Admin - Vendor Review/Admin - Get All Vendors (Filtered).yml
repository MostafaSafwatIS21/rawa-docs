info:
  name: Admin - Get All Vendors (Filtered)
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/admins/vendors?page=1&limit=10"
  params:
    - name: search
      value: ""
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: sortBy
      value: storeName
      type: query
      disabled: true
    - name: sortOrder
      value: ASC
      type: query
      disabled: true
    - name: approvalStatus
      value: REJECTED
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve list of all vendors filtered by approvalStatus, search query, and pagination.
