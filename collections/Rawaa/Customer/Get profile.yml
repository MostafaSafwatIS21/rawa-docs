info:
  name: Get profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/customers/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
