info:
  name: "[Admin] Update customer profile"
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{base_url}}/customers/:id"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
          "firstName": "John Updated"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
