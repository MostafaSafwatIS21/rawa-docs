info:
  name: "[Admin] Get all customers"
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/customers"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
