info:
  name: "[Admin] Create customer profile"
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/customers/:userId"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: userId
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
          "firstName": "John",
          "lastName": "Doe"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
