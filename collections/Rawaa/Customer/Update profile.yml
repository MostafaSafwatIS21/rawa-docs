info:
  name: Update profile
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{base_url}}/customers/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: multipart-form
    data:
      - name: firstName
        type: text
        value: Updated
      - name: lastName
        type: text
        value: Name
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
