info:
  name: "[ A ] List All Subscriptions"
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/admin/subscriptions?page=1&limit=20"
  params:
    - name: status
      value: active
      type: query
      disabled: true
    - name: vendor_id
      value: ""
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Admin / Super Admin

  Returns all subscriptions across all vendors and customers.

  **Query params:**
  - `status` *(optional)* — `active` | `paused` | `cancelled`
  - `vendor_id` *(optional)* — filter by a specific vendor UUID
  - `page` / `limit` — pagination
