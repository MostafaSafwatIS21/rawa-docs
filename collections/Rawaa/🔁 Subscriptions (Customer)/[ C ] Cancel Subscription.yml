info:
  name: "[ C ] Cancel Subscription"
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{base_url}}/subscriptions/{{subscriptionId}}/cancel"
  auth:
    type: bearer
    token: "{{customerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Role:** Customer only

  Permanently cancels the subscription. **This is irreversible.**

  Sets `status = cancelled` and `cancelledAt = now()`. No further deliveries will be generated.
